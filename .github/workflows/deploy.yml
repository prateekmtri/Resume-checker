deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Backend to Render
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL is missing!"
            exit 1
          fi
          curl -f -X POST "$RENDER_HOOK"
        
      - name: Deploy Frontend to Netlify
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_HOOK" ]; then
            echo "Error: NETLIFY_DEPLOY_HOOK_URL is missing!"
            exit 1
          fi
          curl -f -X POST "$NETLIFY_HOOK"