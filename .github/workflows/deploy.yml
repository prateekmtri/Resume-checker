name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend (Dry Run)
        run: docker build ./backend -t backend-test:latest

      - name: Build Frontend (Dry Run)
        run: docker build ./frontend -t frontend-test:latest